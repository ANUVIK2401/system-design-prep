<svg viewBox="0 0 760 110" xmlns="http://www.w3.org/2000/svg"><style>
text{font-family:'IBM Plex Sans',system-ui,sans-serif;fill:#0B1F3F;text-anchor:middle;dominant-baseline:middle}
.diag-label{font-size:12px;font-weight:600}.diag-sublabel,.diag-arrow-label{font-size:9.5px;fill:#4A5873}
.diag-box{fill:#fff;stroke:#0B1F3F;stroke-width:1.5;rx:7px}.role-cache{fill:#FBF5E6;stroke:#B8892B}
.role-async,.role-queue{fill:#FBF5E6;stroke:#9A5B13}.role-db{fill:#EEF2F9;stroke:#4A5873}
.diag-arrow-path{fill:none;stroke:#66728A;stroke-width:1.5}
</style>
          <defs>
            <marker id="loopArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A6514"/></marker>
          </defs>
          <g>
            <rect class="diag-box role-cache" x="10" y="25" width="135" height="55"/>
            <text class="diag-label" x="77" y="55">Pick a question</text>
          </g>
          <path class="diag-arrow-path" d="M145,52 L165,52" marker-end="url(#loopArrow)"/>
          <g>
            <rect class="diag-box" x="165" y="25" width="135" height="55"/>
            <text class="diag-label" x="232" y="55">45 min timer</text>
          </g>
          <path class="diag-arrow-path" d="M300,52 L320,52" marker-end="url(#loopArrow)"/>
          <g>
            <rect class="diag-box" x="320" y="25" width="135" height="55"/>
            <text class="diag-label" x="387" y="55">Deliver out loud</text>
          </g>
          <path class="diag-arrow-path" d="M455,52 L475,52" marker-end="url(#loopArrow)"/>
          <g>
            <rect class="diag-box role-cache" x="475" y="25" width="135" height="55"/>
            <text class="diag-label" x="542" y="55">Review gaps</text>
          </g>
          <path class="diag-arrow-path" d="M610,52 L630,52" marker-end="url(#loopArrow)"/>
          <g>
            <rect class="diag-box" x="630" y="25" width="120" height="55"/>
            <text class="diag-label" x="690" y="48">Repeat</text>
            <text class="diag-sublabel" x="690" y="64">until smooth</text>
          </g>
          <path class="diag-arrow-path" d="M690,80 C690,100 80,100 80,80" marker-end="url(#loopArrow)"/>
        </svg>