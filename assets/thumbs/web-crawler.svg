<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg"><style>
text{font-family:'IBM Plex Sans',system-ui,sans-serif;fill:#0B1F3F;text-anchor:middle;dominant-baseline:middle}
.diag-label{font-size:12px;font-weight:600}.diag-sublabel,.diag-arrow-label{font-size:9.5px;fill:#4A5873}
.diag-box{fill:#fff;stroke:#0B1F3F;stroke-width:1.5;rx:7px}.role-cache{fill:#FBF5E6;stroke:#B8892B}
.role-async,.role-queue{fill:#FBF5E6;stroke:#9A5B13}.role-db{fill:#EEF2F9;stroke:#4A5873}
.diag-arrow-path{fill:none;stroke:#66728A;stroke-width:1.5}
</style>
          <defs><marker id="wcHldArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A6514"/></marker></defs>

          <g><rect class="diag-box role-client" x="10" y="20" width="120" height="46"/><text class="diag-label" x="70" y="43" style="font-size:11px">Seed URLs</text><text class="diag-sublabel" x="70" y="58" style="font-size:8.5px">operator input</text></g>
          <path class="diag-arrow-path" d="M130,43 L165,80" marker-end="url(#wcHldArrow)"/>

          <g><rect class="diag-box role-async" x="165" y="80" width="140" height="50"/><text class="diag-label" x="235" y="102" style="font-size:11px">URL Frontier</text><text class="diag-sublabel" x="235" y="118" style="font-size:8.5px">sharded by domain</text></g>

          <path class="diag-arrow-path" d="M305,105 L340,105" marker-end="url(#wcHldArrow)"/>
          <g><rect class="diag-box" x="340" y="60" width="120" height="46"/><text class="diag-label" x="400" y="83" style="font-size:11px">DNS Cache</text></g>
          <path class="diag-arrow-path" d="M460,83 L495,105" marker-end="url(#wcHldArrow)"/>

          <path class="diag-arrow-path" d="M305,115 L340,140" marker-end="url(#wcHldArrow)"/>
          <g><rect class="diag-box" x="340" y="120" width="150" height="50"/><text class="diag-label" x="415" y="142" style="font-size:11px">Fetcher Worker Pool</text><text class="diag-sublabel" x="415" y="158" style="font-size:8.5px">respects per-domain rate limit</text></g>

          <path class="diag-arrow-path" d="M340,150 L305,150" marker-end="url(#wcHldArrow)" stroke-dasharray="3 3"/>
          <g><rect class="diag-box role-cache" x="150" y="150" width="140" height="46"/><text class="diag-label" x="220" y="169" style="font-size:11px">Robots.txt Cache</text><text class="diag-sublabel" x="220" y="184" style="font-size:8.5px">politeness rules</text></g>

          <path class="diag-arrow-path" d="M490,145 L525,145" marker-end="url(#wcHldArrow)"/>
          <g><rect class="diag-box" x="525" y="120" width="130" height="50"/><text class="diag-label" x="590" y="148" style="font-size:11px">Parser / Link Extractor</text></g>

          <path class="diag-arrow-path" d="M590,120 L590,90" marker-end="url(#wcHldArrow)"/>
          <g><rect class="diag-box role-db" x="525" y="45" width="130" height="46"/><text class="diag-label" x="590" y="73" style="font-size:11px">Content Store</text><text class="diag-sublabel" x="590" y="86" style="font-size:8.5px">blob storage</text></g>

          <path class="diag-arrow-path" d="M655,145 L690,145" marker-end="url(#wcHldArrow)"/>
          <g><rect class="diag-box role-cache" x="690" y="120" width="100" height="50"/><text class="diag-label" x="740" y="140" style="font-size:11px">Dedup /</text><text class="diag-label" x="740" y="153" style="font-size:11px">Bloom Svc</text></g>

          <path class="diag-arrow-path" d="M740,120 L740,60 L305,60 L305,90" marker-end="url(#wcHldArrow)" stroke-dasharray="3 3"/>
          <text class="diag-sublabel" x="520" y="52" style="font-size:8.5px;fill:#8A6514">new, deduped URLs loop back to frontier</text>

          <path class="diag-arrow-path" d="M590,170 L590,200" marker-end="url(#wcHldArrow)"/>
          <g><rect class="diag-box role-async" x="525" y="200" width="130" height="46"/><text class="diag-label" x="590" y="223" style="font-size:11px">Recrawl Scheduler</text></g>
          <path class="diag-arrow-path" d="M525,223 L305,155" marker-end="url(#wcHldArrow)" stroke-dasharray="3 3"/>
        </svg>