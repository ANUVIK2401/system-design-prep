          <g><rect class="diag-box" x="235" y="100" width="130" height="46"/><text class="diag-label" x="300" y="118" style="font-size:11px">Scheduler Shard 1</text><text class="diag-sublabel" x="300" y="134" style="font-size:8.5px">leader</text></g>
          <g><rect class="diag-box" x="380" y="100" width="130" height="46"/><text class="diag-label" x="445" y="118" style="font-size:11px">Scheduler Shard N</text><text class="diag-sublabel" x="445" y="134" style="font-size:8.5px">leader</text></g>

          <path class="diag-arrow-path" d="M155,100 L155,80 L600,80 L600,100" marker-end="url(#jsHldArrow)"/>
