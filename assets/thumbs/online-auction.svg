<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg"><style>
text{font-family:'IBM Plex Sans',system-ui,sans-serif;fill:#0B1F3F;text-anchor:middle;dominant-baseline:middle}
.diag-label{font-size:12px;font-weight:600}.diag-sublabel,.diag-arrow-label{font-size:9.5px;fill:#4A5873}
.diag-box{fill:#fff;stroke:#0B1F3F;stroke-width:1.5;rx:7px}.role-cache{fill:#FBF5E6;stroke:#B8892B}
.role-async,.role-queue{fill:#FBF5E6;stroke:#9A5B13}.role-db{fill:#EEF2F9;stroke:#4A5873}
.diag-arrow-path{fill:none;stroke:#66728A;stroke-width:1.5}
</style>
          <defs><marker id="auHldArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A6514"/></marker></defs>

          <g><rect class="diag-box role-client" x="10" y="20" width="110" height="50"/><text class="diag-label" x="65" y="50" style="font-size:11px">Clients</text></g>
          <path class="diag-arrow-path" d="M120,45 L155,45" marker-end="url(#auHldArrow)"/>
          <g><rect class="diag-box role-client" x="155" y="20" width="120" height="50"/><text class="diag-label" x="215" y="50" style="font-size:11px">API Gateway</text></g>

          <path class="diag-arrow-path" d="M215,70 L215,105" marker-end="url(#auHldArrow)"/>
          <g><rect class="diag-box" x="150" y="105" width="130" height="46"/><text class="diag-label" x="215" y="128" style="font-size:11px">Bid Service</text><text class="diag-sublabel" x="215" y="143" style="font-size:8.5px">stateless</text></g>

          <path class="diag-arrow-path" d="M215,151 L215,185" marker-end="url(#auHldArrow)"/>
          <g><rect class="diag-box role-db" x="150" y="185" width="130" height="46"/><text class="diag-label" x="215" y="208" style="font-size:11px">Postgres</text></g>

          <path class="diag-arrow-path" d="M280,128 L340,128" marker-end="url(#auHldArrow)"/>
          <g><rect class="diag-box" x="340" y="105" width="150" height="46"/><text class="diag-label" x="415" y="128" style="font-size:11px">Auction State Machine</text></g>
          <path class="diag-arrow-path" d="M415,151 L415,185" marker-end="url(#auHldArrow)"/>
          <g><rect class="diag-box role-async" x="350" y="185" width="150" height="46"/><text class="diag-label" x="425" y="208" style="font-size:11px">Auction Close Worker</text></g>
          <path class="diag-arrow-path" d="M425,231 L425,260" marker-end="url(#auHldArrow)" stroke-dasharray="3 3"/>
          <g><rect class="diag-box role-cache" x="350" y="260" width="150" height="30"/><text class="diag-label" x="425" y="280" style="font-size:11px">Redis lock (close mutex)</text></g>

          <path class="diag-arrow-path" d="M280,128 L555,128" marker-end="url(#auHldArrow)" stroke-dasharray="3 3"/>
          <g><rect class="diag-box role-async" x="555" y="105" width="150" height="46"/><text class="diag-label" x="630" y="128" style="font-size:11px">Redis Pub/Sub</text></g>
          <path class="diag-arrow-path" d="M630,151 L630,185" marker-end="url(#auHldArrow)"/>
          <g><rect class="diag-box role-async" x="555" y="185" width="150" height="46"/><text class="diag-label" x="630" y="208" style="font-size:11px">WebSocket Gateway</text></g>
          <path class="diag-arrow-path" d="M630,231 L630,20" marker-end="url(#auHldArrow)" stroke-dasharray="3 3"/>
        </svg>