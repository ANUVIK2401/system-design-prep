          <g><rect class="diag-box" x="380" y="105" width="130" height="46"/><text class="diag-label" x="445" y="128" style="font-size:11px">Reservation Svc</text><text class="diag-sublabel" x="445" y="143" style="font-size:8.5px">stateless</text></g>

