<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg"><style>
text{font-family:'IBM Plex Sans',system-ui,sans-serif;fill:#0B1F3F;text-anchor:middle;dominant-baseline:middle}
.diag-label{font-size:12px;font-weight:600}.diag-sublabel,.diag-arrow-label{font-size:9.5px;fill:#4A5873}
.diag-box{fill:#fff;stroke:#0B1F3F;stroke-width:1.5;rx:7px}.role-cache{fill:#FBF5E6;stroke:#B8892B}
.role-async,.role-queue{fill:#FBF5E6;stroke:#9A5B13}.role-db{fill:#EEF2F9;stroke:#4A5873}
.diag-arrow-path{fill:none;stroke:#66728A;stroke-width:1.5}
</style>
          <defs><marker id="gdHldArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A6514"/></marker></defs>

          <g><rect class="diag-box role-client" x="10" y="20" width="130" height="46"/><text class="diag-label" x="75" y="43" style="font-size:11px">Client A</text><text class="diag-sublabel" x="75" y="57" style="font-size:8.5px">local OT engine</text></g>
          <g><rect class="diag-box role-client" x="10" y="90" width="130" height="46"/><text class="diag-label" x="75" y="113" style="font-size:11px">Client B</text><text class="diag-sublabel" x="75" y="127" style="font-size:8.5px">local OT engine</text></g>

          <path class="diag-arrow-path" d="M140,43 L175,70" marker-end="url(#gdHldArrow)"/>
          <path class="diag-arrow-path" d="M140,113 L175,90" marker-end="url(#gdHldArrow)"/>
          <g><rect class="diag-box" x="175" y="60" width="140" height="50"/><text class="diag-label" x="245" y="82" style="font-size:11px">Doc Service</text><text class="diag-sublabel" x="245" y="98" style="font-size:8.5px">WebSocket gateway</text></g>

          <path class="diag-arrow-path" d="M315,85 L350,85" marker-end="url(#gdHldArrow)"/>
          <g><rect class="diag-box role-cache" x="350" y="60" width="140" height="50"/><text class="diag-label" x="420" y="82" style="font-size:11px">OT Server</text><text class="diag-sublabel" x="420" y="98" style="font-size:8.5px">1 logical owner per doc</text></g>

          <path class="diag-arrow-path" d="M490,75 L525,50" marker-end="url(#gdHldArrow)"/>
          <g><rect class="diag-box role-db" x="525" y="20" width="130" height="46"/><text class="diag-label" x="590" y="47" style="font-size:11px">Document Store</text></g>

          <path class="diag-arrow-path" d="M490,95 L525,110" marker-end="url(#gdHldArrow)"/>
          <g><rect class="diag-box role-db" x="525" y="90" width="130" height="46"/><text class="diag-label" x="590" y="118" style="font-size:11px">Revision Log</text></g>

          <path class="diag-arrow-path" d="M590,136 L590,160" marker-end="url(#gdHldArrow)"/>
          <g><rect class="diag-box role-async" x="525" y="160" width="130" height="46"/><text class="diag-label" x="590" y="184" style="font-size:11px">Snapshot Worker</text><text class="diag-sublabel" x="590" y="197" style="font-size:8.5px">compaction</text></g>
          <path class="diag-arrow-path" d="M655,183 L690,183" marker-end="url(#gdHldArrow)"/>
          <g><rect class="diag-box role-db" x="690" y="160" width="100" height="46"/><text class="diag-label" x="740" y="184" style="font-size:11px">Snapshots</text></g>

          <path class="diag-arrow-path" d="M245,110 L245,160" marker-end="url(#gdHldArrow)" stroke-dasharray="3 3"/>
          <g><rect class="diag-box role-async" x="175" y="160" width="140" height="50"/><text class="diag-label" x="245" y="182" style="font-size:11px">Presence Service</text><text class="diag-sublabel" x="245" y="198" style="font-size:8.5px">cursors, avatars</text></g>
          <path class="diag-arrow-path" d="M175,185 L140,90" marker-end="url(#gdHldArrow)" stroke-dasharray="3 3"/>
          <path class="diag-arrow-path" d="M175,175 L140,50" marker-end="url(#gdHldArrow)" stroke-dasharray="3 3"/>
        </svg>