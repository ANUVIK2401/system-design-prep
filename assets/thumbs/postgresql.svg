<svg viewBox="0 0 720 230" xmlns="http://www.w3.org/2000/svg"><style>
text{font-family:'IBM Plex Sans',system-ui,sans-serif;fill:#0B1F3F;text-anchor:middle;dominant-baseline:middle}
.diag-label{font-size:12px;font-weight:600}.diag-sublabel,.diag-arrow-label{font-size:9.5px;fill:#4A5873}
.diag-box{fill:#fff;stroke:#0B1F3F;stroke-width:1.5;rx:7px}.role-cache{fill:#FBF5E6;stroke:#B8892B}
.role-async,.role-queue{fill:#FBF5E6;stroke:#9A5B13}.role-db{fill:#EEF2F9;stroke:#4A5873}
.diag-arrow-path{fill:none;stroke:#66728A;stroke-width:1.5}
</style>
          <defs>
            <marker id="pgArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A6514"/></marker>
            <marker id="pgArrowB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A6514"/></marker>
          </defs>

          <text class="diag-sublabel" x="120" y="14" style="font-size:10px;fill:#8A6514">WRITE PATH</text>
          <g>
            <rect class="diag-box role-client" x="15" y="25" width="100" height="50"/>
            <text class="diag-label" x="65" y="45" style="font-size:11px">App (write)</text>
          </g>
          <path class="diag-arrow-path" d="M115,50 L185,50" marker-end="url(#pgArrowB)"/>
          <g>
            <rect class="diag-box role-db" x="185" y="20" width="140" height="60"/>
            <text class="diag-label" x="255" y="44" style="font-size:11px">Primary</text>
            <text class="diag-sublabel" x="255" y="60" style="font-size:9px">WAL streamed out</text>
          </g>

          <path class="diag-arrow-path" d="M325,38 L470,25" marker-end="url(#pgArrow)" stroke-dasharray="3 3"/>
          <path class="diag-arrow-path" d="M325,62 L470,75" marker-end="url(#pgArrow)" stroke-dasharray="3 3"/>
          <text x="390" y="20" font-size="9" fill="#4A5873" font-family="Inter,sans-serif">streaming replication</text>

          <g>
            <rect class="diag-box role-async" x="470" y="0" width="150" height="50"/>
            <text class="diag-label" x="545" y="20" style="font-size:11px">Read replica 1</text>
            <text class="diag-sublabel" x="545" y="36" style="font-size:9px">async, ~10-50ms lag</text>
          </g>
          <g>
            <rect class="diag-box role-async" x="470" y="55" width="150" height="50"/>
            <text class="diag-label" x="545" y="75" style="font-size:11px">Read replica 2</text>
            <text class="diag-sublabel" x="545" y="91" style="font-size:9px">sync, zero data loss</text>
          </g>

          <text class="diag-sublabel" x="120" y="135" style="font-size:10px;fill:#8A6514">READ PATH</text>
          <g>
            <rect class="diag-box role-client" x="15" y="145" width="100" height="50"/>
            <text class="diag-label" x="65" y="165" style="font-size:11px">App (read)</text>
          </g>
          <path class="diag-arrow-path" d="M115,170 L470,30" marker-end="url(#pgArrow)"/>
          <path class="diag-arrow-path" d="M115,170 L470,80" marker-end="url(#pgArrow)"/>
          <text x="280" y="200" font-size="10" fill="#8A6514" font-family="Inter,sans-serif">reads routed to replicas — primary handles writes only</text>
        </svg>