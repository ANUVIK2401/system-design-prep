<svg viewBox="0 0 760 130" xmlns="http://www.w3.org/2000/svg"><style>
text{font-family:'IBM Plex Sans',system-ui,sans-serif;fill:#0B1F3F;text-anchor:middle;dominant-baseline:middle}
.diag-label{font-size:12px;font-weight:600}.diag-sublabel,.diag-arrow-label{font-size:9.5px;fill:#4A5873}
.diag-box{fill:#fff;stroke:#0B1F3F;stroke-width:1.5;rx:7px}.role-cache{fill:#FBF5E6;stroke:#B8892B}
.role-async,.role-queue{fill:#FBF5E6;stroke:#9A5B13}.role-db{fill:#EEF2F9;stroke:#4A5873}
.diag-arrow-path{fill:none;stroke:#66728A;stroke-width:1.5}
</style>
          <defs>
            <marker id="introArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A6514"/></marker>
          </defs>
          <g>
            <rect class="diag-box role-client" x="10" y="35" width="130" height="60"/>
            <text class="diag-label" x="75" y="60">Clarify</text>
            <text class="diag-sublabel" x="75" y="76">5 min</text>
          </g>
          <path class="diag-arrow-path" d="M140,65 L160,65" marker-end="url(#introArrow)"/>
          <g>
            <rect class="diag-box" x="160" y="35" width="130" height="60"/>
            <text class="diag-label" x="225" y="60">Estimate</text>
            <text class="diag-sublabel" x="225" y="76">3 min</text>
          </g>
          <path class="diag-arrow-path" d="M290,65 L310,65" marker-end="url(#introArrow)"/>
          <g>
            <rect class="diag-box" x="310" y="20" width="150" height="90"/>
            <text class="diag-label" x="385" y="58">High-level</text>
            <text class="diag-label" x="385" y="74">design</text>
            <text class="diag-sublabel" x="385" y="92">15 min</text>
          </g>
          <path class="diag-arrow-path" d="M460,65 L480,65" marker-end="url(#introArrow)"/>
          <g>
            <rect class="diag-box role-cache" x="480" y="20" width="150" height="90"/>
            <text class="diag-label" x="555" y="58">Deep dive</text>
            <text class="diag-sublabel" x="555" y="76">bottlenecks</text>
            <text class="diag-sublabel" x="555" y="92">15 min</text>
          </g>
          <path class="diag-arrow-path" d="M630,65 L650,65" marker-end="url(#introArrow)"/>
          <g>
            <rect class="diag-box" x="650" y="35" width="100" height="60"/>
            <text class="diag-label" x="700" y="60">Wrap-up</text>
            <text class="diag-sublabel" x="700" y="76">5 min</text>
          </g>
        </svg>