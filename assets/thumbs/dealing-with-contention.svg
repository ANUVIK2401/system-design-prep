<svg viewBox="0 0 760 230" xmlns="http://www.w3.org/2000/svg"><style>
text{font-family:'IBM Plex Sans',system-ui,sans-serif;fill:#0B1F3F;text-anchor:middle;dominant-baseline:middle}
.diag-label{font-size:12px;font-weight:600}.diag-sublabel,.diag-arrow-label{font-size:9.5px;fill:#4A5873}
.diag-box{fill:#fff;stroke:#0B1F3F;stroke-width:1.5;rx:7px}.role-cache{fill:#FBF5E6;stroke:#B8892B}
.role-async,.role-queue{fill:#FBF5E6;stroke:#9A5B13}.role-db{fill:#EEF2F9;stroke:#4A5873}
.diag-arrow-path{fill:none;stroke:#66728A;stroke-width:1.5}
</style>
          <defs>
            <marker id="oc1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A6514"/></marker>
            <marker id="oc2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A6514"/></marker>
          </defs>

          <text class="diag-sublabel" x="100" y="14" style="font-size:10px;fill:#8A6514">Request A</text>
          <g><rect class="diag-box role-client" x="10" y="25" width="170" height="45"/><text class="diag-label" x="95" y="48" style="font-size:11px">Read row (v=1)</text></g>
          <path class="diag-arrow-path" d="M180,47 L240,47" marker-end="url(#oc1)"/>
          <g><rect class="diag-box role-cache" x="240" y="25" width="190" height="45"/><text class="diag-label" x="335" y="42" style="font-size:11px">UPDATE WHERE v=1</text><text class="diag-sublabel" x="335" y="58">success → v=2</text></g>

          <text class="diag-sublabel" x="100" y="104" style="font-size:10px;fill:#8A6514">Request B (concurrent)</text>
          <g><rect class="diag-box role-client" x="10" y="115" width="170" height="45"/><text class="diag-label" x="95" y="138" style="font-size:11px">Read row (v=1)</text></g>
          <path class="diag-arrow-path" d="M180,137 L240,137" marker-end="url(#oc2)"/>
          <g><rect class="diag-box" x="240" y="115" width="190" height="45" stroke="#8A6514"/><text class="diag-label" x="335" y="132" style="font-size:11px">UPDATE WHERE v=1</text><text class="diag-sublabel" x="335" y="148" style="fill:#8A6514">0 rows affected — conflict!</text></g>

          <path class="diag-arrow-path" d="M335,160 C335,185 335,185 200,185" marker-end="url(#oc2)"/>
          <g><rect class="diag-box role-async" x="20" y="163" width="180" height="45"/><text class="diag-label" x="110" y="180" style="font-size:11px">Retry: re-read v=2</text><text class="diag-sublabel" x="110" y="196">re-apply change</text></g>
          <path class="diag-arrow-path" d="M200,185 L420,185" marker-end="url(#oc2)" stroke-dasharray="4 3"/>
          <path class="diag-arrow-path" d="M420,185 L430,160" marker-end="url(#oc2)" stroke-dasharray="4 3"/>
          <text class="diag-sublabel" x="600" y="185" style="font-size:9px">retry succeeds against v=2</text>
        </svg>