<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg"><style>
text{font-family:'IBM Plex Sans',system-ui,sans-serif;fill:#0B1F3F;text-anchor:middle;dominant-baseline:middle}
.diag-label{font-size:12px;font-weight:600}.diag-sublabel,.diag-arrow-label{font-size:9.5px;fill:#4A5873}
.diag-box{fill:#fff;stroke:#0B1F3F;stroke-width:1.5;rx:7px}.role-cache{fill:#FBF5E6;stroke:#B8892B}
.role-async,.role-queue{fill:#FBF5E6;stroke:#9A5B13}.role-db{fill:#EEF2F9;stroke:#4A5873}
.diag-arrow-path{fill:none;stroke:#66728A;stroke-width:1.5}
</style>
          <defs><marker id="stHldArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A6514"/></marker></defs>
          <g><rect class="diag-box role-client" x="10" y="20" width="110" height="50"/><text class="diag-label" x="65" y="50" style="font-size:11px">Clients</text></g>
          <path class="diag-arrow-path" d="M120,45 L155,45" marker-end="url(#stHldArrow)"/>
          <g><rect class="diag-box role-client" x="155" y="20" width="120" height="50"/><text class="diag-label" x="215" y="50" style="font-size:11px">API Gateway</text></g>

          <path class="diag-arrow-path" d="M215,70 L215,105" marker-end="url(#stHldArrow)"/>
          <g><rect class="diag-box" x="90" y="105" width="130" height="46"/><text class="diag-label" x="155" y="128" style="font-size:11px">Upload Svc</text><text class="diag-sublabel" x="155" y="143" style="font-size:8.5px">stateless</text></g>
          <g><rect class="diag-box" x="240" y="105" width="140" height="46"/><text class="diag-label" x="310" y="128" style="font-size:11px">Leaderboard Svc</text><text class="diag-sublabel" x="310" y="143" style="font-size:8.5px">stateless</text></g>

          <path class="diag-arrow-path" d="M155,151 L155,185" marker-end="url(#stHldArrow)"/>
          <g><rect class="diag-box role-db" x="90" y="185" width="130" height="46"/><text class="diag-label" x="155" y="208" style="font-size:11px">S3</text></g>
          <path class="diag-arrow-path" d="M155,151 L60,151 L60,185" marker-end="url(#stHldArrow)" stroke-dasharray="3 3"/>
          <g><rect class="diag-box role-db" x="10" y="185" width="90" height="46"/><text class="diag-label" x="55" y="208" style="font-size:11px">Postgres</text></g>

          <path class="diag-arrow-path" d="M310,151 L310,185" marker-end="url(#stHldArrow)"/>
          <g><rect class="diag-box role-cache" x="245" y="185" width="130" height="46"/><text class="diag-label" x="310" y="208" style="font-size:11px">Redis</text></g>

          <path class="diag-arrow-path" d="M155,151 L440,151 L440,185" marker-end="url(#stHldArrow)" stroke-dasharray="3 3"/>
          <g><rect class="diag-box role-async" x="390" y="105" width="130" height="46"/><text class="diag-label" x="455" y="128" style="font-size:11px">Match Queue</text></g>
          <path class="diag-arrow-path" d="M455,151 L455,185" marker-end="url(#stHldArrow)"/>
          <g><rect class="diag-box role-async" x="390" y="185" width="130" height="46"/><text class="diag-label" x="455" y="203" style="font-size:11px">Segment Matcher</text><text class="diag-sublabel" x="455" y="218" style="font-size:8.5px">geohash/R-tree</text></g>
          <path class="diag-arrow-path" d="M455,231 L455,240 L560,240" marker-end="url(#stHldArrow)"/>
          <g><rect class="diag-box role-db" x="560" y="215" width="140" height="46"/><text class="diag-label" x="630" y="238" style="font-size:11px">Cassandra</text><text class="diag-sublabel" x="630" y="253" style="font-size:8.5px">SegmentEffort</text></g>
          <path class="diag-arrow-path" d="M560,238 L420,238 L420,231" marker-end="url(#stHldArrow)" stroke-dasharray="3 3"/>

          <path class="diag-arrow-path" d="M520,128 L555,128" marker-end="url(#stHldArrow)"/>
          <g><rect class="diag-box role-async" x="555" y="105" width="130" height="46"/><text class="diag-label" x="620" y="128" style="font-size:11px">Feed Fan-out</text></g>
        </svg>