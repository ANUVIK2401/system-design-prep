<svg viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg"><style>
text{font-family:'IBM Plex Sans',system-ui,sans-serif;fill:#0B1F3F;text-anchor:middle;dominant-baseline:middle}
.diag-label{font-size:12px;font-weight:600}.diag-sublabel,.diag-arrow-label{font-size:9.5px;fill:#4A5873}
.diag-box{fill:#fff;stroke:#0B1F3F;stroke-width:1.5;rx:7px}.role-cache{fill:#FBF5E6;stroke:#B8892B}
.role-async,.role-queue{fill:#FBF5E6;stroke:#9A5B13}.role-db{fill:#EEF2F9;stroke:#4A5873}
.diag-arrow-path{fill:none;stroke:#66728A;stroke-width:1.5}
</style>
          <defs>
            <marker id="tsArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A6514"/></marker>
          </defs>

          <text class="diag-sublabel" x="360" y="16" style="font-size:10px;fill:#4A5873" text-anchor="middle">TIME →  (right edge = now)</text>
          <line x1="20" y1="30" x2="700" y2="30" stroke="#8A6514" stroke-width="1"/>
          <path d="M690,25 L700,30 L690,35" stroke="#8A6514" stroke-width="1.5" fill="none"/>

          <g>
            <rect class="diag-box role-cache" x="500" y="55" width="200" height="50" rx="6"/>
            <text class="diag-label" x="600" y="76" style="font-size:11px">Raw — 1s resolution</text>
            <text class="diag-sublabel" x="600" y="92">kept 7 days</text>
          </g>

          <g>
            <rect class="diag-box role-async" x="240" y="55" width="240" height="50" rx="6"/>
            <text class="diag-label" x="360" y="76" style="font-size:11px">1min rollup</text>
            <text class="diag-sublabel" x="360" y="92">kept 90 days</text>
          </g>

          <g>
            <rect class="diag-box role-db" x="20" y="55" width="200" height="50" rx="6"/>
            <text class="diag-label" x="120" y="76" style="font-size:11px">1hr rollup</text>
            <text class="diag-sublabel" x="120" y="92">kept forever</text>
          </g>

          <path d="M500,80 L480,80" stroke="#8A6514" stroke-width="1.5" marker-end="url(#tsArrow)" fill="none"/>
          <text x="490" y="70" text-anchor="middle" font-size="9" fill="#4A5873" font-family="Inter,sans-serif">downsample</text>
          <path d="M240,80 L220,80" stroke="#8A6514" stroke-width="1.5" marker-end="url(#tsArrow)" fill="none"/>
          <text x="230" y="70" text-anchor="middle" font-size="9" fill="#4A5873" font-family="Inter,sans-serif">downsample</text>

          <g>
            <rect x="500" y="130" width="200" height="36" rx="6" fill="#FAECEC" stroke="#8A6514"/>
            <text x="600" y="153" text-anchor="middle" font-size="10" fill="#A63D40" font-family="Inter,sans-serif">retention TTL deletes raw &gt;7d</text>
          </g>
          <path d="M600,130 L600,108" stroke="#A63D40" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>

          <g>
            <rect x="240" y="130" width="240" height="36" rx="6" fill="#FAECEC" stroke="#8A6514"/>
            <text x="360" y="153" text-anchor="middle" font-size="10" fill="#A63D40" font-family="Inter,sans-serif">retention TTL deletes 1min rollup &gt;90d</text>
          </g>
          <path d="M360,130 L360,108" stroke="#A63D40" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>

          <text x="120" y="190" text-anchor="middle" font-size="10" fill="#8A6514" font-family="Inter,sans-serif">storage cost stays bounded — total size doesn't grow unboundedly with time</text>
        </svg>