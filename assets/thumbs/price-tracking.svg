<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg"><style>
text{font-family:'IBM Plex Sans',system-ui,sans-serif;fill:#0B1F3F;text-anchor:middle;dominant-baseline:middle}
.diag-label{font-size:12px;font-weight:600}.diag-sublabel,.diag-arrow-label{font-size:9.5px;fill:#4A5873}
.diag-box{fill:#fff;stroke:#0B1F3F;stroke-width:1.5;rx:7px}.role-cache{fill:#FBF5E6;stroke:#B8892B}
.role-async,.role-queue{fill:#FBF5E6;stroke:#9A5B13}.role-db{fill:#EEF2F9;stroke:#4A5873}
.diag-arrow-path{fill:none;stroke:#66728A;stroke-width:1.5}
</style>
          <defs><marker id="ptHldArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A6514"/></marker></defs>

          <g><rect class="diag-box role-async" x="10" y="20" width="120" height="46"/><text class="diag-label" x="70" y="43" style="font-size:11px">Scheduler</text><text class="diag-sublabel" x="70" y="58" style="font-size:8.5px">cron-driven</text></g>
          <path class="diag-arrow-path" d="M130,43 L165,43" marker-end="url(#ptHldArrow)"/>
          <g><rect class="diag-box role-async" x="165" y="20" width="120" height="46"/><text class="diag-label" x="225" y="48" style="font-size:11px">Per-Domain Queues</text></g>
          <path class="diag-arrow-path" d="M285,43 L320,43" marker-end="url(#ptHldArrow)"/>
          <g><rect class="diag-box" x="320" y="20" width="130" height="46"/><text class="diag-label" x="385" y="43" style="font-size:11px">Scraper Workers</text><text class="diag-sublabel" x="385" y="58" style="font-size:8.5px">pool, stateless</text></g>

          <path class="diag-arrow-path" d="M385,66 L385,100" marker-end="url(#ptHldArrow)" stroke-dasharray="3 3"/>
          <g><rect class="diag-box role-cache" x="320" y="100" width="130" height="46"/><text class="diag-label" x="385" y="128" style="font-size:11px">Redis Throttle</text></g>
          <path class="diag-arrow-path" d="M450,43 L560,43" marker-end="url(#ptHldArrow)"/>
          <g><rect class="diag-box role-client" x="560" y="20" width="120" height="46"/><text class="diag-label" x="620" y="43" style="font-size:11px">Target Sites</text><text class="diag-sublabel" x="620" y="58" style="font-size:8.5px">200k+ domains</text></g>

          <path class="diag-arrow-path" d="M320,150 L285,150 L285,180" marker-end="url(#ptHldArrow)"/>
          <g><rect class="diag-box role-db" x="220" y="180" width="130" height="46"/><text class="diag-label" x="285" y="208" style="font-size:11px">TimescaleDB</text></g>
          <path class="diag-arrow-path" d="M350,203 L385,203" marker-end="url(#ptHldArrow)"/>
          <g><rect class="diag-box role-async" x="385" y="180" width="130" height="46"/><text class="diag-label" x="450" y="203" style="font-size:11px">Alert Engine</text></g>
          <path class="diag-arrow-path" d="M515,203 L550,203" marker-end="url(#ptHldArrow)"/>
          <g><rect class="diag-box role-async" x="550" y="180" width="130" height="46"/><text class="diag-label" x="615" y="203" style="font-size:11px">Notification Svc</text></g>

          <g><rect class="diag-box role-client" x="10" y="240" width="110" height="46"/><text class="diag-label" x="65" y="268" style="font-size:11px">Client</text></g>
          <path class="diag-arrow-path" d="M120,263 L155,263" marker-end="url(#ptHldArrow)"/>
          <g><rect class="diag-box" x="155" y="240" width="110" height="46"/><text class="diag-label" x="210" y="268" style="font-size:11px">Read API</text></g>
          <path class="diag-arrow-path" d="M265,255 L285,230 L285,226" marker-end="url(#ptHldArrow)" stroke-dasharray="3 3"/>
        </svg>