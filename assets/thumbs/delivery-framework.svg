<svg viewBox="0 0 760 110" xmlns="http://www.w3.org/2000/svg"><style>
text{font-family:'IBM Plex Sans',system-ui,sans-serif;fill:#0B1F3F;text-anchor:middle;dominant-baseline:middle}
.diag-label{font-size:12px;font-weight:600}.diag-sublabel,.diag-arrow-label{font-size:9.5px;fill:#4A5873}
.diag-box{fill:#fff;stroke:#0B1F3F;stroke-width:1.5;rx:7px}.role-cache{fill:#FBF5E6;stroke:#B8892B}
.role-async,.role-queue{fill:#FBF5E6;stroke:#9A5B13}.role-db{fill:#EEF2F9;stroke:#4A5873}
.diag-arrow-path{fill:none;stroke:#66728A;stroke-width:1.5}
</style>
          <defs>
            <marker id="estArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A6514"/></marker>
          </defs>
          <g>
            <rect class="diag-box role-client" x="10" y="25" width="160" height="55"/>
            <text class="diag-label" x="90" y="48">DAU</text>
            <text class="diag-sublabel" x="90" y="65">÷ 86,400</text>
          </g>
          <path class="diag-arrow-path" d="M170,52 L190,52" marker-end="url(#estArrow)"/>
          <g>
            <rect class="diag-box" x="190" y="25" width="160" height="55"/>
            <text class="diag-label" x="270" y="48">Write QPS</text>
            <text class="diag-sublabel" x="270" y="65">× R:W ratio</text>
          </g>
          <path class="diag-arrow-path" d="M350,52 L370,52" marker-end="url(#estArrow)"/>
          <g>
            <rect class="diag-box" x="370" y="25" width="160" height="55"/>
            <text class="diag-label" x="450" y="48">Read QPS</text>
          </g>
          <path class="diag-arrow-path" d="M170,80 C170,95 270,95 270,80" marker-end="url(#estArrow)"/>
          <g>
            <rect class="diag-box role-cache" x="550" y="25" width="200" height="55"/>
            <text class="diag-label" x="650" y="48">Storage/yr</text>
            <text class="diag-sublabel" x="650" y="65">size × QPS × 86400 × 365</text>
          </g>
          <path class="diag-arrow-path" d="M350,52 C440,15 530,15 550,40" marker-end="url(#estArrow)"/>
        </svg>