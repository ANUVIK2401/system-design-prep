<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg"><style>
text{font-family:'IBM Plex Sans',system-ui,sans-serif;fill:#0B1F3F;text-anchor:middle;dominant-baseline:middle}
.diag-label{font-size:12px;font-weight:600}.diag-sublabel,.diag-arrow-label{font-size:9.5px;fill:#4A5873}
.diag-box{fill:#fff;stroke:#0B1F3F;stroke-width:1.5;rx:7px}.role-cache{fill:#FBF5E6;stroke:#B8892B}
.role-async,.role-queue{fill:#FBF5E6;stroke:#9A5B13}.role-db{fill:#EEF2F9;stroke:#4A5873}
.diag-arrow-path{fill:none;stroke:#66728A;stroke-width:1.5}
</style>
          <defs><marker id="dcHldArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A6514"/></marker></defs>

          <g><rect class="diag-box role-client" x="10" y="30" width="140" height="50"/><text class="diag-label" x="80" y="52" style="font-size:11px">Client Library</text><text class="diag-sublabel" x="80" y="68" style="font-size:8.5px">consistent-hash aware</text></g>

          <path class="diag-arrow-path" d="M150,55 L185,55" marker-end="url(#dcHldArrow)"/>
          <g><rect class="diag-box role-cache" x="185" y="20" width="130" height="46"/><text class="diag-label" x="250" y="43" style="font-size:11px">Cache Node 1</text><text class="diag-sublabel" x="250" y="57" style="font-size:8px">shard A — primary</text></g>
          <path class="diag-arrow-path" d="M150,80 L185,110" marker-end="url(#dcHldArrow)"/>
          <g><rect class="diag-box role-cache" x="185" y="90" width="130" height="46"/><text class="diag-label" x="250" y="113" style="font-size:11px">Cache Node 2</text><text class="diag-sublabel" x="250" y="127" style="font-size:8px">shard B — primary</text></g>
          <path class="diag-arrow-path" d="M150,105 L185,170" marker-end="url(#dcHldArrow)"/>
          <g><rect class="diag-box role-cache" x="185" y="160" width="130" height="46"/><text class="diag-label" x="250" y="183" style="font-size:11px">Cache Node 3</text><text class="diag-sublabel" x="250" y="197" style="font-size:8px">shard C — primary</text></g>

          <path class="diag-arrow-path" d="M315,43 L350,90" marker-end="url(#dcHldArrow)" stroke-dasharray="3 3"/>
          <path class="diag-arrow-path" d="M315,113 L350,113" marker-end="url(#dcHldArrow)" stroke-dasharray="3 3"/>
          <path class="diag-arrow-path" d="M315,183 L350,140" marker-end="url(#dcHldArrow)" stroke-dasharray="3 3"/>
          <g><rect class="diag-box role-cache" x="350" y="95" width="140" height="50"/><text class="diag-label" x="420" y="117" style="font-size:11px">Replica Nodes</text><text class="diag-sublabel" x="420" y="133" style="font-size:8px">1 per shard, RF=2</text></g>

          <path class="diag-arrow-path" d="M250,66 L250,250" marker-end="url(#dcHldArrow)" stroke-dasharray="2 3"/>
          <path class="diag-arrow-path" d="M250,206 L250,250" marker-end="url(#dcHldArrow)" stroke-dasharray="2 3"/>
          <g><rect class="diag-box role-async" x="140" y="250" width="220" height="50"/><text class="diag-label" x="250" y="272" style="font-size:11px">Coordination / Membership</text><text class="diag-sublabel" x="250" y="288" style="font-size:8px">gossip protocol or etcd/ZooKeeper</text></g>

          <path class="diag-arrow-path" d="M490,120 L525,60" marker-end="url(#dcHldArrow)"/>
          <path class="diag-arrow-path" d="M150,55 L525,60" marker-end="url(#dcHldArrow)" stroke-dasharray="3 3"/>
          <g><rect class="diag-box role-db" x="525" y="35" width="150" height="50"/><text class="diag-label" x="600" y="57" style="font-size:11px">Backing Database</text><text class="diag-sublabel" x="600" y="73" style="font-size:8px">source of truth, miss path only</text></g>

          <path class="diag-arrow-path" d="M360,275 L680,275 L680,90" marker-end="url(#dcHldArrow)" stroke-dasharray="2 3"/>
          <text class="diag-sublabel" x="520" y="270" style="font-size:8px;fill:#4A5873">membership also tracks DB health for failover routing</text>
        </svg>