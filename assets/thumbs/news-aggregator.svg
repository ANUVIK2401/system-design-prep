<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg"><style>
text{font-family:'IBM Plex Sans',system-ui,sans-serif;fill:#0B1F3F;text-anchor:middle;dominant-baseline:middle}
.diag-label{font-size:12px;font-weight:600}.diag-sublabel,.diag-arrow-label{font-size:9.5px;fill:#4A5873}
.diag-box{fill:#fff;stroke:#0B1F3F;stroke-width:1.5;rx:7px}.role-cache{fill:#FBF5E6;stroke:#B8892B}
.role-async,.role-queue{fill:#FBF5E6;stroke:#9A5B13}.role-db{fill:#EEF2F9;stroke:#4A5873}
.diag-arrow-path{fill:none;stroke:#66728A;stroke-width:1.5}
</style>
          <defs><marker id="naHldArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A6514"/></marker></defs>

          <g><rect class="diag-box role-async" x="10" y="20" width="120" height="46"/><text class="diag-label" x="70" y="43" style="font-size:11px">URL Frontier</text><text class="diag-sublabel" x="70" y="58" style="font-size:8.5px">priority queue</text></g>
          <path class="diag-arrow-path" d="M130,43 L165,43" marker-end="url(#naHldArrow)"/>
          <g><rect class="diag-box" x="165" y="20" width="120" height="46"/><text class="diag-label" x="225" y="47" style="font-size:11px">Crawler Fleet</text></g>
          <path class="diag-arrow-path" d="M285,43 L320,43" marker-end="url(#naHldArrow)"/>
