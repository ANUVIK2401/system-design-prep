          <path class="diag-arrow-path" d="M440,43 L475,43" marker-end="url(#naHldArrow)"/>
          <g><rect class="diag-box role-db" x="475" y="20" width="100" height="46"/><text class="diag-label" x="525" y="47" style="font-size:11px">S3</text></g>
          <path class="diag-arrow-path" d="M525,66 L525,95" marker-end="url(#naHldArrow)"/>
          <g><rect class="diag-box role-db" x="465" y="95" width="120" height="46"/><text class="diag-label" x="525" y="123" style="font-size:11px">Postgres</text></g>

          <path class="diag-arrow-path" d="M285,66 L285,95" marker-end="url(#naHldArrow)" stroke-dasharray="3 3"/>
          <g><rect class="diag-box role-async" x="220" y="95" width="130" height="46"/><text class="diag-label" x="285" y="123" style="font-size:11px">Kafka</text></g>

