          <g><rect class="diag-box role-async" x="590" y="185" width="120" height="46"/><text class="diag-label" x="650" y="208" style="font-size:11px">Kafka</text></g>
          <path class="diag-arrow-path" d="M650,231 L650,255 L280,275" marker-end="url(#ypHldArrow)"/>
          <g><rect class="diag-box role-async" x="590" y="255" width="120" height="40"/><text class="diag-label" x="650" y="279" style="font-size:11px">Reindexer</text></g>
